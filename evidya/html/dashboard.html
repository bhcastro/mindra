<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../css/tarefas.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
  </head>
  <body>
    <header>
      <div>
        <h1>Olá, usuário!</h1>
        <p>Acompanhe o que precisa de sua atenção.</p>
      </div>
    </header>
    <main>
      <div id="div-nova-tarefa">
        <label for="input-nova-tarefa">Nova tarefa:</label>
        <input type="text" id="input-nova-tarefa" placeholder="Digite..." />
        <button type="button" id="btn-adicionar-nova-tarefa">Adicionar</button>
        <br />
        <span id="span-mensagens-tarefas"></span>
      </div>
      <section id="section-tarefas" class="card">
        <div id="div-tarefas-pendentes" class="div-tarefas">
          <h3>Tarefas Diárias:</h3>
          <ul id="lista-tarefas-pendentes"></ul>
        </div>
        <div id="div-tarefas-pontuais" class="div-tarefas ocultar">
          <h3>Tarefas Pontuais:</h3>
          <ul id="lista-tarefas-pontuais"></ul>
          <button type="button" id="btn-limpar-lista" class="">
            Limpar Lista
          </button>
        </div>
      </section>
      <div id="div-nova-coleta">
        <label for="input-nova-coleta">Nova coleta:</label>
        <input type="text" id="input-nova-coleta" placeholder="Digite..." />
        <button type="button" id="btn-adicionar-nova-coleta">Adicionar</button>
							        <br>
        <span id="span-mensagens-recoletas"></span>
      </div>
      <div id="div-recoletas" class="div-tarefas card ocultar">
        <h3>Recoletas:</h3>
        <ul id="lista-recoletas"></ul>
        <button type="button" id="btn-limpar-lista-recoletas">
          Limpar Lista
        </button>
      </div>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
